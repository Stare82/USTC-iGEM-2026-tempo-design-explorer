image: python:3.13.9-slim

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  MPLBACKEND: "Agg"

cache:
  key: "$CI_COMMIT_REF_SLUG-pip"
  paths:
    - .cache/pip

model-smoke-test:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
  script:
    - python -m py_compile app.py test_installation.py tempo-design-explorer/server.py tempo-design-explorer/backend/model_adapter.py
    - python test_installation.py
