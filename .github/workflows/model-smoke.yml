name: Model smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-model:
    name: Deterministic package test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.9"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python entry points
        run: >-
          python -m py_compile
          app.py
          test_installation.py
          tempo-design-explorer/server.py
          tempo-design-explorer/backend/model_adapter.py

      - name: Validate macOS/Linux launcher syntax
        if: runner.os == 'Linux'
        run: sh -n run_mac_linux.sh

      - name: Run clean-install deterministic test
        run: python test_installation.py
